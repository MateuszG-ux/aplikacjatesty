
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171715">
  <title>Magazyn | StockFlow</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="#" class="logo" aria-label="Strona główna">
        <img src="images/logo.png" alt="Logo firmy">
    </a>

    <nav class="main-categories" aria-label="Kategorie główne">
      <button class="main-tab active" data-category="odziez" type="button">Odzież</button>
      <button class="main-tab" data-category="ppe" type="button">PPE</button>
      <button class="main-tab" data-category="obuwie" type="button">Obuwie</button>
      <button class="main-tab" data-category="pozostale" type="button">Pozostałe</button>
      <button class="main-tab orders-tab" data-view="orders" type="button">Do zamówienia</button>
    </nav>

    <div class="topbar-spacer"></div>
  </header>

  <main class="app">
    <section class="filters" id="filters" aria-label="Filtry produktów"></section>

    <div class="results-info">
      <span id="results-count">Produkty: 0</span>
      <input
        type="search"
        id="search"
        placeholder="Szukaj produktu..."
        aria-label="Szukaj produktu"
      >
    </div>

    <section id="product-list" class="product-list" aria-label="Lista produktów">
    </section>

    <p id="empty-message" class="empty-message" hidden>
      Brak produktów w tej kategorii.
    </p>

    <footer class="footer">
      <span>Stan Magazynowy</span>
      <span>Wersja demonstracyjna</span>
    </footer>
  </main>
</body>
</html>
